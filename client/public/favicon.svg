<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Accent Gloss Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Cart Glow / Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312E81" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Gloss Overlay -->
  <rect x="16" y="16" width="480" height="240" rx="128" fill="url(#glossGrad)" />

  <!-- Inner Icon Group (Subtle Drop Shadow) -->
  <g filter="url(#shadow)">
    <!-- Shopping Bag Frame -->
    <path d="M144 192 C144 144, 184 104, 256 104 C328 104, 368 144, 368 192" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Main Bag Body -->
    <path d="M120 192 L392 192 C406 192, 416 204, 414 218 L386 402 C384 416, 372 426, 358 426 L154 426 C140 426, 128 416, 126 402 L98 218 C96 204, 106 192, 120 192 Z" 
          fill="#FFFFFF" />

    <!-- Lightning Bolt / Quick Speed Accent inside Bag -->
    <path d="M272 232 L216 320 L256 320 L240 384 L296 296 L256 296 Z" 
          fill="url(#bgGrad)" />

    <!-- Modern Speed Sparkle Accent -->
    <circle cx="360" cy="160" r="20" fill="url(#sparkleGrad)" />
  </g>
</svg>